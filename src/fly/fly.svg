<!--
  An original stylised Drosophila, standing upright and facing the viewer so it
  can dance like a person rather than skitter like an insect. Anatomically this
  is nonsense - real flies do not stand on two legs - and it is meant to be:
  the rig reads far better bipedal, and the dance was always an artistic
  mapping rather than simulated motor behaviour. ASSUMPTIONS.md says so.

  What is kept from the real animal: red compound eyes, feathered aristae, a
  banded abdomen, and two wings that do the actual courtship work.

  Six limbs survive the move upright as two legs plus two pairs of arms.

  Every moving part is its own <g> with a documented pivot. rig.ts composes the
  transforms (translate(pivot) rotate translate(-pivot)) rather than relying on
  transform-box, which browsers still disagree about for SVG.
-->
<!-- The viewBox carries a margin beyond the artwork so a fully extended wing
     or a raised arm has somewhere to go without being clipped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -16 292 312" id="fly-svg" role="img"
     aria-label="A cartoon fruit fly standing upright on two legs with red compound eyes, feathered antennae, four arms and two wings.">
  <style>
    /* Limbs are strokes, not shapes. Without this they default to fill:black
       and stroke:none, and render as solid triangles. */
    #fly-svg .limb path {
      fill: none;
      stroke: #6b5738;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #fly-svg .limb.leg path { stroke-width: 9; }
    #fly-svg .limb.arm path { stroke-width: 6.5; }
    #fly-svg .limb .tarsus { stroke-width: 5; }
    #fly-svg .limb.far path { stroke: #52402a; }
  </style>

  <defs>
    <linearGradient id="fly-thorax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d6a51"/>
      <stop offset="1" stop-color="#3b3125"/>
    </linearGradient>
    <linearGradient id="fly-abdomen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a35d"/>
      <stop offset="1" stop-color="#6d5326"/>
    </linearGradient>
    <linearGradient id="fly-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4c38"/>
      <stop offset="1" stop-color="#3a2f22"/>
    </linearGradient>
    <radialGradient id="fly-eye" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.45" stop-color="#e5352b"/>
      <stop offset="1" stop-color="#8d140f"/>
    </radialGradient>
    <linearGradient id="fly-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b8d4f0" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <g id="fly-root">
    <!-- Shadow on the dance floor. Not rigged. -->
    <ellipse id="fly-shadow" cx="120" cy="258" rx="58" ry="10" fill="#000" opacity="0.28"/>

    <!-- Legs sit behind the body so the hips overlap them. Pivots are the hips. -->
    <g id="leg-l" class="limb leg">
      <path d="M100 198 L88 228 L74 250"/>
      <path class="tarsus" d="M74 250 L58 254"/>
    </g>
    <g id="leg-r" class="limb leg">
      <path d="M140 198 L152 228 L166 250"/>
      <path class="tarsus" d="M166 250 L182 254"/>
    </g>

    <g id="fly-body">
      <!-- Wings, behind everything. The inner group holds the resting sweep,
           which the rig would otherwise overwrite every frame. -->
      <g id="wing-l">
        <g transform="translate(110 106) rotate(-152)">
          <ellipse cx="48" cy="0" rx="54" ry="20" fill="url(#fly-wing)" stroke="#dbe9f7" stroke-opacity="0.5" stroke-width="1"/>
          <path d="M4 -4 Q50 -10 96 -2" fill="none" stroke="#cfe0f2" stroke-opacity="0.34" stroke-width="0.9"/>
          <path d="M6 5 Q50 8 92 4" fill="none" stroke="#cfe0f2" stroke-opacity="0.26" stroke-width="0.8"/>
        </g>
      </g>
      <g id="wing-r">
        <g transform="translate(130 106) rotate(-28)">
          <ellipse cx="48" cy="0" rx="54" ry="20" fill="url(#fly-wing)" stroke="#dbe9f7" stroke-opacity="0.5" stroke-width="1"/>
          <path d="M4 4 Q50 10 96 2" fill="none" stroke="#cfe0f2" stroke-opacity="0.34" stroke-width="0.9"/>
          <path d="M6 -5 Q50 -8 92 -4" fill="none" stroke="#cfe0f2" stroke-opacity="0.26" stroke-width="0.8"/>
        </g>
      </g>

      <!-- Abdomen. Banding is what makes it read as a fruit fly rather than a bee. -->
      <g id="abdomen">
        <ellipse cx="120" cy="184" rx="37" ry="42" fill="url(#fly-abdomen)"/>
        <path d="M86 166 Q120 158 154 166" fill="none" stroke="#2f2718" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
        <path d="M85 190 Q120 183 155 190" fill="none" stroke="#2f2718" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
        <path d="M92 213 Q120 207 148 213" fill="none" stroke="#2f2718" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
        <ellipse cx="106" cy="163" rx="17" ry="8" fill="#f0d79b" opacity="0.2"/>
      </g>

      <!-- Thorax. -->
      <g id="thorax">
        <ellipse cx="120" cy="128" rx="39" ry="37" fill="url(#fly-thorax)"/>
        <path d="M96 104 Q120 96 144 104" fill="none" stroke="#9a866a" stroke-width="3.4" opacity="0.55" stroke-linecap="round"/>
        <circle cx="104" cy="114" r="2.6" fill="#1e1913" opacity="0.65"/>
        <circle cx="120" cy="109" r="2.6" fill="#1e1913" opacity="0.65"/>
        <circle cx="136" cy="114" r="2.6" fill="#1e1913" opacity="0.65"/>
      </g>

      <!-- Lower arms, drawn behind the upper pair. -->
      <g id="arm-ll" class="limb arm far">
        <path d="M92 146 L66 170 L56 194"/>
        <path class="tarsus" d="M56 194 L48 202"/>
      </g>
      <g id="arm-lr" class="limb arm far">
        <path d="M148 146 L174 170 L184 194"/>
        <path class="tarsus" d="M184 194 L192 202"/>
      </g>

      <!-- Upper arms. These are the ones that go up at the antennae to groom. -->
      <g id="arm-ul" class="limb arm">
        <path d="M86 116 L56 132 L40 116"/>
        <path class="tarsus" d="M40 116 L32 108"/>
      </g>
      <g id="arm-ur" class="limb arm">
        <path d="M154 116 L184 132 L200 116"/>
        <path class="tarsus" d="M200 116 L208 108"/>
      </g>

      <!-- Head. Pivot: the neck. -->
      <g id="head">
        <circle cx="120" cy="64" r="38" fill="url(#fly-head)"/>
        <ellipse id="eye-l" cx="95" cy="58" rx="18" ry="21" fill="url(#fly-eye)"/>
        <ellipse id="eye-r" cx="145" cy="58" rx="18" ry="21" fill="url(#fly-eye)"/>
        <circle cx="89" cy="49" r="5" fill="#fff" opacity="0.75"/>
        <circle cx="139" cy="49" r="5" fill="#fff" opacity="0.75"/>
        <path d="M108 90 Q120 100 132 90" fill="none" stroke="#2b2216" stroke-width="4" stroke-linecap="round"/>

        <!-- Aristae. Pivots at the antennal bases. -->
        <g id="antenna-l">
          <path d="M102 34 Q90 14 72 6" fill="none" stroke="#2b2216" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M95 24 L88 16 M87 16 L81 7 M78 10 L74 1" stroke="#2b2216" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <g id="antenna-r">
          <path d="M138 34 Q150 14 168 6" fill="none" stroke="#2b2216" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M145 24 L152 16 M153 16 L159 7 M162 10 L166 1" stroke="#2b2216" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
