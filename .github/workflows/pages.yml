# Build and publish the app to GitHub Pages.
#
# The site is served from https://<user>.github.io/<repo>/, so the build needs
# BASE_PATH set to that subpath. The build config reads it; nothing else in the
# source knows about hosting.
#
# Tests run before the deploy, so a red suite never reaches the public URL.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded artifact is not what ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # No `enablement: true` here. Creating a Pages site needs repo-admin
      # scope, which the workflow GITHUB_TOKEN does not have -- it can deploy
      # to an existing Pages site but cannot create one, and asking it to fails
      # with "Resource not accessible by integration". Pages must be turned on
      # once by hand: Settings -> Pages -> Source -> GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
